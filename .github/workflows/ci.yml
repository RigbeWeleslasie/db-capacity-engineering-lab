name: CI

# =============================================================================
# Calls the group platform's reusable golden pipeline (gitleaks -> trivy
# config -> zizmor -> docker build -> trivy image -> tag AMI -> tflocal
# apply). See nebyathhailu/regional-health-platform's docs/MODULE-CONTRACTS.md
# for the frozen gate order.
#
# Pinned to main (regional-health-platform#11 + #12, merged).
#
# Pin history: 70b8811 (initial) -> 2e6e721 -> 59ca405 -> 31e2a92
# (aiven_host/aiven_port moved from `inputs` to `secrets` -- GitHub Actions'
# `vars` context is documented-unreliable cross-repo into a reusable
# workflow) -> c95c942 (post PR#7+#8: vars->secrets landed on main properly,
# and app_ami_id's docker-tag-string bug fixed) -> da449d0 (post PR#11+#12:
# PR#11 adds create_alb, defaulting false, so the ALB (blocked by
# LocalStack's freemium license -- "not included ... available in an
# upgraded license") is no longer even attempted, only declared+scanned;
# PR#12 adds the group's bootstrap/ remote-state root, see terraform/README
# for the one-time setup this repo hasn't run against yet).
#
# aiven_host/aiven_port/aiven_password are ALL repo SECRETS (not
# variables) — matches golden-ci.yml's schema as of c95c942. Set under
# Settings -> Secrets and variables -> Actions -> Secrets.
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: nebyathhailu/regional-health-platform/.github/workflows/golden-ci.yml@da449d0ac5ebadf47d74c5720cac1ee760b1d0ff
    with:
      app_dir: api
      image_name: capacity-api
      terraform_dir: terraform
      run_apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      localstack_auth_token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      aiven_host: ${{ secrets.AIVEN_HOST }}
      aiven_port: ${{ secrets.AIVEN_PORT }}
      aiven_password: ${{ secrets.AIVEN_PASSWORD }}
