name: CI

# =============================================================================
# Calls the group platform's reusable golden pipeline (gitleaks -> trivy
# config -> zizmor -> docker build -> trivy image -> tag AMI -> tflocal
# apply). See nebyathhailu/regional-health-platform's docs/MODULE-CONTRACTS.md
# for the frozen gate order.
#
# Pinned to main (regional-health-platform#8, merged).
#
# Pin history: 70b8811 (initial) -> 2e6e721 (gitleaks GITHUB_TOKEN fix +
# Aiven passthrough) -> 59ca405 (main, post PR#6 merge) -> 31e2a92
# (fix/golden-ci-aiven-secrets branch tip, pinned there directly while
# PR#7 sat unreviewed: aiven_host/aiven_port moved from `inputs` to
# `secrets` in golden-ci.yml's workflow_call schema, because GitHub
# Actions' `vars` context is documented-unreliable when passed cross-repo
# into a reusable workflow hosted in a different repo — confirmed here the
# hard way: TF_VAR_aiven_host/TF_VAR_aiven_port resolved empty/0 against
# 59ca405 even with the repo Variables correctly set, causing Terraform's
# own validation to fail with "aiven_host must be a bare hostname ...
# var.aiven_host is \"\""; secrets propagate reliably where vars don't) ->
# c95c942 (main, post PR#7 AND PR#8 merge — PR#7 landed the same
# vars->secrets fix on main properly, and PR#8 fixed modules/service's
# aws_instance.app.ami passing the docker-tag AMI string straight through
# instead of stripping it to the bare ami-<hex> id, confirmed by this
# repo's own CI reaching InvalidAMIID.Malformed once the aiven bug above
# stopped masking it). Now pinned back to main since both fixes are
# properly merged and reviewed there.
#
# aiven_host/aiven_port/aiven_password are ALL repo SECRETS (not
# variables) — matches golden-ci.yml's schema as of c95c942. Set under
# Settings -> Secrets and variables -> Actions -> Secrets.
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: nebyathhailu/regional-health-platform/.github/workflows/golden-ci.yml@main
    with:
      app_dir: api
      image_name: capacity-api
      terraform_dir: terraform
      run_apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      localstack_auth_token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      aiven_host: ${{ secrets.AIVEN_HOST }}
      aiven_port: ${{ secrets.AIVEN_PORT }}
      aiven_password: ${{ secrets.AIVEN_PASSWORD }}
